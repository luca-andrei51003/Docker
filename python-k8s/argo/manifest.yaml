apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-k8s-python
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/luca-andrei51003/Docker/'
    targetRevision: HEAD
    path: python-k8s/argo
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: test-k8s-python
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
#kubectl port-forward svc/argocd-server -n argocd 8080:443

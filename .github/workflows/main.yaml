name: Build, Push, and Update K8s Manifest

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-push-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: culceanluca/test-k8s-python

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.AGENT_USER }}
        password: ${{ secrets.AGENT_PASSWORD }}

    - name: Build and push Docker image
      id: build
      run: |
        IMAGE_TAG="${GITHUB_SHA::7}"
        echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -t "${IMAGE_NAME}:latest" ./python-k8s
        docker push "${IMAGE_NAME}:${IMAGE_TAG}"
        docker push "${IMAGE_NAME}:latest"

    - name: Update deployment image tag
      run: |
        IMAGE_TAG="${{ steps.build.outputs.image_tag }}"
        sed -i "s|^\(\s*image:\s*\).*|\1${IMAGE_NAME}:${IMAGE_TAG}|" python-k8s/k8s/deployment.yaml

    - name: Commit and push manifest update
      run: |
        IMAGE_TAG="${{ steps.build.outputs.image_tag }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add python-k8s/k8s/deployment.yaml
        if git diff --cached --quiet; then
          echo "No manifest changes to commit."
          exit 0
        fi
        git commit -m "chore: deploy ${IMAGE_NAME}:${IMAGE_TAG} [skip ci]"
        git push
